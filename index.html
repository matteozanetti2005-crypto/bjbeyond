<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJ Beyond — One step beyond AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
        .section { scroll-margin-top: 80px; }
        .metric-card { transition: transform 0.2s ease; }
        .metric-card:hover { transform: translateY(-4px); }
        .lang-active { background-color: #6366f1 !important; color: white !important; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">

    <!-- NAVBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-zinc-950/95 border-b border-zinc-800 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-2xl flex items-center justify-center">
                    <span class="text-white font-bold text-2xl">B</span>
                </div>
                <span class="font-display text-2xl font-semibold tracking-tighter">BJ Beyond</span>
            </div>
            
            <!-- SELETTORE LINGUA -->
            <div class="flex items-center bg-zinc-900 rounded-3xl p-1 border border-zinc-800">
                <button onclick="switchLang('it')" id="lang-it" class="px-4 py-1.5 text-sm font-medium rounded-3xl flex items-center gap-x-1.5 lang-active">🇮🇹 IT</button>
                <button onclick="switchLang('en')" id="lang-en" class="px-4 py-1.5 text-sm font-medium rounded-3xl flex items-center gap-x-1.5">🇬🇧 EN</button>
            </div>
            
            <div class="hidden md:flex items-center gap-x-8 text-sm font-medium">
                <a href="#about" class="hover:text-indigo-400 transition" data-it="Chi sono" data-en="About">Chi sono</a>
                <a href="#human-edge" class="hover:text-indigo-400 transition" data-it="Human Edge Index" data-en="Human Edge Index">Human Edge Index</a>
                <a href="#projects" class="hover:text-indigo-400 transition" data-it="Progetti" data-en="Projects">Progetti</a>
            </div>
            
            <div class="flex items-center gap-x-3">
                <a href="https://x.com/Bj_Beyond" target="_blank" class="px-5 py-2.5 text-sm font-semibold bg-white text-zinc-950 rounded-3xl hover:bg-zinc-100 transition flex items-center gap-x-2">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span data-it="Seguimi" data-en="Follow">Seguimi</span>
                </a>
                <button onclick="document.getElementById('human-edge').scrollIntoView({ behavior: 'smooth' })" class="px-5 py-2.5 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 rounded-3xl transition" data-it="Scopri il Report" data-en="Read Report">Scopri il Report</button>
            </div>
        </div>
    </nav>

    <!-- HERO + ABOUT + HUMAN EDGE + PROJECTS (rimasti uguali) -->
    <!-- [Ho mantenuto tutto il tuo contenuto originale] -->

    <!-- ==================== SOUNDTRACK ==================== -->
    <audio id="bj-soundtrack" loop preload="none">
        <source src="Official Music Soundtrack.mp4" type="audio/mp4">
        Il tuo browser non supporta l'audio.
    </audio>

    <!-- ==================== FOOTER CON PRIVACY E COOKIES ==================== -->
    <footer class="bg-zinc-950 border-t border-zinc-800 py-16">
        <div class="max-w-5xl mx-auto px-6 text-center text-zinc-500 text-sm">
            <div class="flex justify-center gap-x-8 mb-8 text-2xl">
                <a href="https://x.com/Bj_Beyond" target="_blank" class="hover:text-white transition"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="https://www.tiktok.com/@bj_beyond" target="_blank" class="hover:text-white transition"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://linktr.ee/Bj_Beyond" target="_blank" class="hover:text-white transition"><i class="fa-solid fa-link"></i></a>
            </div>
            
            <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-6">
                <a href="privacy-policy.md" class="hover:text-zinc-300 transition">Privacy Policy</a>
                <a href="cookie-policy.md" class="hover:text-zinc-300 transition">Cookie Policy</a>
            </div>
            
            <p>© 2026 BJ Beyond — One step beyond AI</p>
            <p class="mt-1 text-xs">Sito statico su GitHub Pages</p>
        </div>
    </footer>

    <script>
        // ==================== SOUNDTRACK ====================
        const soundtrack = document.getElementById('bj-soundtrack');
        let hasInteracted = false;

        function playSoundtrack() {
            if (hasInteracted) return;
            hasInteracted = true;
            soundtrack.volume = 0.35;
            soundtrack.play().catch(() => {});
        }

        ['click', 'touchstart', 'scroll'].forEach(ev => {
            document.addEventListener(ev, playSoundtrack, { once: true });
        });

        // ==================== LINGUA ====================
        function switchLang(lang) {
            document.getElementById('lang-it').classList.remove('lang-active');
            document.getElementById('lang-en').classList.remove('lang-active');
            
            if (lang === 'it') {
                document.getElementById('lang-it').classList.add('lang-active');
            } else {
                document.getElementById('lang-en').classList.add('lang-active');
            }
            
            document.querySelectorAll('[data-it]').forEach(el => {
                el.innerHTML = (lang === 'it') ? el.getAttribute('data-it') : el.getAttribute('data-en');
            });
            
            document.documentElement.lang = lang;
        }

        window.onload = function() {
            document.getElementById('lang-it').classList.add('lang-active');
        };
    </script>
</body>
</html>
