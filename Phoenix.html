.step-num.done { background: rgba(0,229,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); }
.step-num.active { background: rgba(255,77,77,0.1); border: 1px solid var(--red); color: var(--red); animation: pulse 0.8s infinite; }

@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,0.3);} 50%{box-shadow:0 0 0 5px rgba(255,77,77,0);} }

.btn-share:hover { background: rgba(0,229,255,0.12); box-shadow: 0 0 20px rgba(0,229,255,0.15); }
.disclaimer { font-size: 9px; color: #383848; line-height: 1.7; padding: 10px 14px; background: #07070f; border: 1px solid var(--border); border-radius: 8px; }
.footer { text-align: center; margin-top: 28px; font-size: 10px; color: #333; }

<script>
// ====================== FETCH DA URL ======================
async function fetchPostText(url) {
  try {
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const response = await fetch(proxyUrl);
    const html = await response.text();

    let postText = '';
    let match = html.match(/<meta property="og:description" content="([^"]+)"/i);
    if (match && match[1]) postText = match[1];

    if (!postText || postText.length < 15) {
      match = html.match(/<title>([^<]+)<\/title>/i);
      if (match && match[1]) postText = match[1].replace(/ \| X| on X/gi, '');
    }

    if (!postText || postText.length < 15) {
      match = html.match(/"text":"([^"]{15,})"/);
      if (match && match[1]) postText = match[1];
    }

    if (!postText || postText.length < 15) {
      match = html.match(/data-testid="tweetText"[^>]*>([^<]{15,})/i);
      if (match && match[1]) postText = match[1];
    }

    postText = postText.replace(/\\u002F/g, '/').replace(/\\"/g, '"').replace(/&amp;/g, '&').trim();

    if (postText.length < 10) throw new Error("Could not extract text");
    return postText;
  } catch (e) {
    throw new Error("Failed to fetch post. Paste text manually.");
  }
}

// ====================== ANALISI EURISTICA ======================
function analyzePost(text) {
  const words = text.trim().split(/\s+/);
  const chars = text.length;
  const sentences = text.split(/[.!?]+/).filter(Boolean).length;
  const hook = words.slice(0, 8).join(' ');

  const hasQ = /\?/.test(text);
  const hasN = /\d+/.test(text);
  const hasHash = /#\w+/.test(text);
  const hasEmoji = /\p{Emoji}/u.test(text);
  const hasThread = /\uD83E\uDDF5|thread|1\//i.test(text);
  const hasUrg = /breaking|just|now|today/i.test(text);
  const hasList = /\u2192|\u2022|\d\.|step/i.test(text);
  const hasContra = /wrong|nobody|everyone|actually|myth/i.test(text);
  const hasProof = /million|billion|study|research|data|report/i.test(text);
  const caps = (text.match(/[A-Z]/g) || []).length / Math.max(chars, 1);
  const spam = /buy now|click here|follow back|dm me|free money/i.test(text);

  const hookStr = [hasQ, hasN, hasUrg, /^(if|why|how|what|here|nobody|most)/i.test(hook), hasEmoji].filter(Boolean).length;

  const pFav = Math.min(0.95, 0.05 + hookStr * 0.07 + (hasN ? 0.06 : 0) + (hasProof ? 0.05 : 0) + (chars > 100 ? 0.04 : 0));
  const pRep = Math.min(0.93, 0.02 + (hasQ ? 0.09 : 0) + (hasContra ? 0.06 : 0) + (hasThread ? 0.04 : 0));
  const pRet = Math.min(0.90, 0.02 + (hasProof ? 0.07 : 0) + (hasList ? 0.05 : 0) + (hasN ? 0.04 : 0));
  const pDwl = Math.min(0.98, 0.30 + (Math.min(chars, 280) / 280) * 0.35 + (hasList ? 0.12 : 0) + (sentences > 2 ? 0.06 : 0));
  const pShr = Math.min(0.88, 0.01 + (hasProof ? 0.05 : 0) + (hasContra ? 0.04 : 0));
  const pOon = Math.min(0.85, (hasHash ? 0.06 : 0) + (hasProof ? 0.05 : 0) + (hasN ? 0.04 : 0) + hookStr * 0.03);

  const spamS = spam ? 0.75 : caps > 0.35 ? 0.35 : 0.02;
  const blockP = spam ? 0.55 : caps > 0.45 ? 0.30 : 0.03;

  const raw = pFav * 0.5 + pRep * 1.0 + pRet * 0.4 + pDwl * 0.8 + pShr * 0.6 + pOon * 0.15 + spamS * (-3.0) + blockP * (-2.5);
  const finalScore = Math.max(12, Math.min(96, Math.round((raw + 1) / 1.8 * 100)));

  const signals = [];
  if (hasUrg) signals.push({ t: "Urgency signal detected", pos: true });
  if (hookStr >= 3) signals.push({ t: "Strong hook (first 8 words)", pos: true });
  if (hasQ) signals.push({ t: "Question → reply trigger", pos: true });
  if (hasN) signals.push({ t: "Numbers → credibility boost", pos: true });
  if (hasProof) signals.push({ t: "Social proof / data detected", pos: true });
  if (hasList) signals.push({ t: "List/steps → dwell time ↑", pos: true });
  if (hasThread) signals.push({ t: "Thread format detected", pos: true });
  if (hasHash) signals.push({ t: "Hashtags → OON discovery", pos: true });
  if (spam) signals.push({ t: "Spam language detected", pos: false });
  if (caps > 0.35) signals.push({ t: "Excessive CAPS → spam signal", pos: false });
  if (blockP > 0.20) signals.push({ t: "Block prediction elevated", pos: false });
  if (chars < 50) signals.push({ t: "Too short → low dwell time", pos: false });
  if (!hasEmoji && !hasN && !hasQ) signals.push({ t: "No hook triggers detected", pos: false });

  return {
    finalScore,
    scores: {
      favorite: Math.round(pFav * 100),
      reply: Math.round(pRep * 100),
      repost: Math.round(pRet * 100),
      dwell: Math.round(pDwl * 100),
      oon: Math.round(pOon * 100),
      spam: Math.round(spamS * 100)
    },
    signals,
    stats: { words: words.length, chars, hookStr },
    verdict: finalScore >= 75 ? "HIGH RANKING POTENTIAL" : finalScore >= 50 ? "MODERATE SIGNAL" : "LOW REACH PREDICTED",
    verdictColor: finalScore >= 75 ? "#00e5ff" : finalScore >= 50 ? "#ffaa00" : "#ff4d4d"
  };
}
